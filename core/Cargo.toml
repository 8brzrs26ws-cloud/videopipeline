[package]
name = "videopipeline-core"
version = "0.17.1"
edition = "2021"
description = "VideoPipeline — pełna logika kodowania (biblioteka dynamiczna)"

[lib]
name = "videopipeline_core"
path = "src/lib.rs"
# Rust nie ma stabilnego ABI: biblioteka i binarka muszą być zbudowane tym samym rustc.
crate-type = ["dylib"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Dolby Vision RPU i HDR10+ (biblioteki z dovi_tool / hdr10plus_tool) — wstrzykiwanie w locie.
dolby_vision = "3.4"
hdr10plus = { version = "2.1", features = ["hevc", "json"] }
