<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>VideoPipeline</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26292b"/>
      <stop offset="1" stop-color="#141516"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bec6"/>
      <stop offset="0.5" stop-color="#7d838d"/>
      <stop offset="1" stop-color="#4a4f58"/>
    </linearGradient>
    <linearGradient id="steelV" x1="0" y1="0" x2="1" y2="0">
