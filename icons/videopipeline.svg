  <!-- tło -->
  <rect x="8" y="8" width="240" height="240" rx="46" fill="url(#bg)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="44.5" fill="none" stroke="#556d59" stroke-width="3"/>

