  <rect x="113" y="36" width="30" height="52" fill="url(#metalH)" stroke="#3b4148" stroke-width="2"/>
  <g stroke="#3a4047" stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M115,42 L141,45" /><path d="M115,47 L141,50" /><path d="M115,52 L141,55" /><path d="M115,57 L141,60" /><path d="M115,62 L141,65" /><path d="M115,67 L141,70" /><path d="M115,72 L141,75" /><path d="M115,77 L141,80" /></g>
  <rect x="104" y="80" width="48" height="10" rx="3" fill="url(#metalH)" stroke="#3b4148" stroke-width="2"/>
