<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>VideoPipeline</title>
  <defs>
    <!-- stal: poziome pasy jak w chromowanym odlewie -->
    <linearGradient id="steelV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/><stop offset=".18" stop-color="#c4cad0"/>
      <stop offset=".45" stop-color="#7c848d"/><stop offset=".7" stop-color="#4c535b"/>
      <stop offset=".88" stop-color="#7f8790"/><stop offset="1" stop-color="#b9c0c7"/>
    </linearGradient>
    <linearGradient id="steelH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#454b52"/><stop offset=".18" stop-color="#9aa1a9"/>
      <stop offset=".38" stop-color="#f1f3f5"/><stop offset=".55" stop-color="#b3bac1"/>
      <stop offset=".8" stop-color="#6a727b"/><stop offset="1" stop-color="#3c4248"/>
    </linearGradient>
    <linearGradient id="pillarL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b626a"/><stop offset=".3" stop-color="#d6dbe0"/>
      <stop offset=".6" stop-color="#8d959d"/><stop offset="1" stop-color="#454b52"/>
    </linearGradient>
    <linearGradient id="pillarR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#4a5057"/><stop offset=".3" stop-color="#b9c0c7"/>
      <stop offset=".6" stop-color="#7d858e"/><stop offset="1" stop-color="#3f454c"/>
    </linearGradient>
    <radialGradient id="ball" cx=".36" cy=".32" r=".72">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#d9dde1"/>
      <stop offset=".65" stop-color="#7a828b"/><stop offset="1" stop-color="#363b41"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6fc4"/><stop offset=".55" stop-color="#8cc6ef"/><stop offset="1" stop-color="#fdf0c4"/>
    </linearGradient>
    <radialGradient id="sun" cx="190" cy="146" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".15" stop-color="#fff3b0"/>
      <stop offset=".4" stop-color="#ffd24d" stop-opacity=".75"/><stop offset="1" stop-color="#ffb93a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa7c9"/><stop offset="1" stop-color="#9cc3a8"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c9a52"/><stop offset="1" stop-color="#2d6e35"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ad6f2"/><stop offset="1" stop-color="#2a6ea8"/>
    </linearGradient>
    <linearGradient id="filmG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e33"/><stop offset=".5" stop-color="#0d0e10"/><stop offset="1" stop-color="#25282c"/>
    </linearGradient>
    <clipPath id="picclip"><path d="M56,122 Q128,140 200,122 Q215,156 200,190 Q128,172 56,190 Q41,156 56,122 Z"/></clipPath>
  </defs>

