  <g fill="#f4f4f4"><rect x="47.4" y="109.1" width="7.2" height="6.4" rx="1.4"/><rect x="47.4" y="194.5" width="7.2" height="6.4" rx="1.4"/><rect x="61.4" y="111.3" width="7.2" height="6.4" rx="1.4"/><rect x="61.4" y="192.3" width="7.2" height="6.4" rx="1.4"/><rect x="75.4" y="113.1" width="7.2" height="6.4" rx="1.4"/><rect x="75.4" y="190.5" width="7.2" height="6.4" rx="1.4"/><rect x="89.4" y="114.4" width="7.2" height="6.4" rx="1.4"/><rect x="89.4" y="189.2" width="7.2" height="6.4" rx="1.4"/><rect x="103.4" y="115.3" width="7.2" height="6.4" rx="1.4"/><rect x="103.4" y="188.3" width="7.2" height="6.4" rx="1.4"/><rect x="117.4" y="115.7" width="7.2" height="6.4" rx="1.4"/><rect x="117.4" y="187.9" width="7.2" height="6.4" rx="1.4"/><rect x="131.4" y="115.7" width="7.2" height="6.4" rx="1.4"/><rect x="131.4" y="187.9" width="7.2" height="6.4" rx="1.4"/><rect x="145.4" y="115.3" width="7.2" height="6.4" rx="1.4"/><rect x="145.4" y="188.3" width="7.2" height="6.4" rx="1.4"/><rect x="159.4" y="114.4" width="7.2" height="6.4" rx="1.4"/><rect x="159.4" y="189.2" width="7.2" height="6.4" rx="1.4"/><rect x="173.4" y="113.1" width="7.2" height="6.4" rx="1.4"/><rect x="173.4" y="190.5" width="7.2" height="6.4" rx="1.4"/><rect x="187.4" y="111.3" width="7.2" height="6.4" rx="1.4"/><rect x="187.4" y="192.3" width="7.2" height="6.4" rx="1.4"/><rect x="201.4" y="109.1" width="7.2" height="6.4" rx="1.4"/><rect x="201.4" y="194.5" width="7.2" height="6.4" rx="1.4"/></g>
  <g clip-path="url(#picclip)">
    <rect x="30" y="110" width="200" height="90" fill="url(#sky)"/>
    <circle cx="186" cy="146" r="34" fill="url(#sun)"/>
    <path d="M30,170 L72,140 L92,150 L122,124 L152,152 L170,146 L200,168 L230,172 V200 H30 Z" fill="#3f8a4a"/>
    <path d="M122,124 L135,135 L128,135 L141,149 L111,149 Z" fill="#6fae72" opacity=".7"/>
    <path d="M30,168 Q90,152 130,166 T230,170 V200 H30 Z" fill="#5ea44c"/>
    <rect x="30" y="172" width="200" height="8" fill="url(#lake)"/>
    <path d="M30,180 Q100,174 150,181 T230,179 V200 H30 Z" fill="#2f6f2f"/>
    <g fill="#1f5226">
      <path d="M56,181 l5,-15 l5,15 z"/><path d="M64,182 l4,-12 l4,12 z"/>
      <path d="M182,180 l5,-16 l5,16 z"/><path d="M191,181 l4,-12 l4,12 z"/><path d="M173,181 l4,-11 l4,11 z"/>
