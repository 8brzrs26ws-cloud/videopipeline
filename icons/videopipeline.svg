<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>VideoPipeline</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e8eb"/><stop offset=".3" stop-color="#959ca4"/>
      <stop offset=".7" stop-color="#555c64"/><stop offset="1" stop-color="#858d95"/>
    </linearGradient>
    <linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f666e"/><stop offset=".3" stop-color="#d9dde1"/>
      <stop offset=".55" stop-color="#9aa1a9"/><stop offset="1" stop-color="#4f555c"/>
    </linearGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#a7aeb6"/><stop offset="1" stop-color="#454b52"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fd0"/><stop offset=".6" stop-color="#9fd0f2"/><stop offset="1" stop-color="#fff2c6"/>
    </linearGradient>
    <radialGradient id="sun" cx="186" cy="146" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbe8"/><stop offset=".25" stop-color="#ffe27a"/>
      <stop offset=".6" stop-color="#ffc94a" stop-opacity=".5"/><stop offset="1" stop-color="#ffc94a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4e8"/><stop offset="1" stop-color="#2b6fa8"/>
    </linearGradient>
    <clipPath id="picclip"><path d="M50,119 Q128,134 206,119 Q221,155 206,191 Q128,177 50,191 Q35,155 50,119 Z"/></clipPath>
  </defs>
  <!-- trzpień: rączka z kulkami -->
  <rect x="44" y="12" width="168" height="15" rx="7.5" fill="url(#metal)" stroke="#3b4148" stroke-width="2"/>
  <circle cx="44" cy="19.5" r="13" fill="url(#ball)" stroke="#3b4148" stroke-width="2"/>
  <circle cx="212" cy="19.5" r="13" fill="url(#ball)" stroke="#3b4148" stroke-width="2"/>
  <rect x="106" y="4" width="44" height="38" rx="8" fill="url(#metalH)" stroke="#3b4148" stroke-width="2.2"/>
  <!-- rama imadła (ramka z otworem) -->
  <path fill-rule="evenodd" fill="url(#metal)" stroke="#353b42" stroke-width="2.6"
        d="M32,48 H224 A22,22 0 0 1 246,70 V222 A20,20 0 0 1 226,242 H30 A20,20 0 0 1 10,222 V70 A22,22 0 0 1 32,48 Z
           M36,82 V210 H220 V82 Z"/>
  <!-- podstawa -->
  <rect x="6" y="214" width="244" height="34" rx="12" fill="url(#metal)" stroke="#353b42" stroke-width="2.6"/>
  <rect x="14" y="218" width="228" height="5" rx="2.5" fill="#ffffff" opacity=".45"/>
  <rect x="20" y="54" width="216" height="6" rx="3" fill="#ffffff" opacity=".5"/>
  <!-- otwór -->
  <rect x="36" y="82" width="184" height="128" fill="#2a2f35"/>
  <!-- płyta dociskowa -->
  <rect x="40" y="86" width="176" height="11" rx="3" fill="url(#metal)" stroke="#353b42" stroke-width="2"/>
