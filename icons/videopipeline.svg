    <rect x="180" y="118" width="8" height="5" rx="1.5"/>
    <rect x="68"  y="157" width="8" height="5" rx="1.5"/><rect x="82"  y="157" width="8" height="5" rx="1.5"/>
    <rect x="96"  y="157" width="8" height="5" rx="1.5"/><rect x="110" y="157" width="8" height="5" rx="1.5"/>
    <rect x="124" y="157" width="8" height="5" rx="1.5"/><rect x="138" y="157" width="8" height="5" rx="1.5"/>
    <rect x="152" y="157" width="8" height="5" rx="1.5"/><rect x="166" y="157" width="8" height="5" rx="1.5"/>
