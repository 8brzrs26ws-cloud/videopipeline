[package]
name = "videopipeline"
version = "0.16.0"
edition = "2021"
description = "VideoPipeline — TUI w stylu Midnight Commandera + tryb skryptowy"

[[bin]]
name = "videopipeline"
path = "src/main.rs"

[dependencies]
videopipeline-core = { path = "../core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
ratatui = "0.29"
