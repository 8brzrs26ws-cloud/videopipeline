name: Release (AppImage + deb, x86-64-v3)

# Ta sama ścieżka co lokalnie: ./build-local.sh (Docker, Debian 13). Zwykle wydania robi się lokalnie
# przez ./build-local.sh && ./release.sh vX.Y.Z — workflow jest zapasowy (ręczny lub po tagu).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag wydania do utworzenia (np. v0.13.0). Puste = tylko artefakty do pobrania.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Cache (ffmpeg, dovi_tool, hdr10plus_tool, linuxdeploy, cargo)
        uses: actions/cache@v4
        with:
          path: build/cache
          key: release-${{ runner.os }}-${{ hashFiles('packaging/appimage/build-appimage.sh', 'docker/Dockerfile') }}
          restore-keys: release-${{ runner.os }}-

      - name: Budowanie (Docker, Debian 13)
        run: ./build-local.sh

      - uses: actions/upload-artifact@v4
        with:
          name: VideoPipeline-release
          path: dist/*
          if-no-files-found: error

      - name: Wydanie na GitHubie
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
